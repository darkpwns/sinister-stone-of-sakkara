# PDF field map of the fillable ACKS II character sheet (campaign.yaml party.pc_pdf_template) <-> the actor's
# prepared view (`acks actor show`, the old sheet shape). Read by scripts/charsheet.py only (single source).
# Each row: [PDF field, view key, type]. Placeholders: {i} row index 0-6 (fields starting "Weapon"/"Wpn") or 0-9
# (proficiencies); {h} henchman slot written a.b with slot = a*3+b (0-5); {l}{s} spell level 1-6 and slot 1-8; {s} slot
# 1-8 (written as index s-1). Types: str, int, mod (signed integer, written +3/0/-1), bonus (as mod but zero is +0),
# lines (list, one item per line). @henchman rows are written only by actor2pdf, from the PC's henchmen in hiring
# order. "Hit Points" (current) is the actor's state.hp: actor2pdf writes it; pdf2actor reports it and leaves the
# actor at full hp. Loyalty and morale stay off the PDF (Judge only).
# Not mapped: radio groups Group1-Group16 (ammunition and torch tally circles; counted in the inventory), Check Box21-23,
# and the domain page (page 4: The Domain of ... Tax Paid, Hex#, Land Value, Families, Revenue, undefined_*,
# Text16-Text20, Income*, Expenses*).
# Built and round-trip tested 2026-11-17 on the user's sheet (Andronax): read -> sheet -> filled PDF -> read again.

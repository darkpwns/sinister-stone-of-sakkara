# Engine rulings (acks-rulings/1). A ruling from Campaign/Rulings.md that replaces one engine rule number or table
# cell goes here as well, so engine results show it as "Judge's ruling (date)". Rule ids: acks2-tools engine/data/rules/*.yaml.
# Example:
#   - rule: morale.modifier_tiers
#     value: cumulative
#     date: 2026-12-01
#     ruling: "Rulings.md 2026-12-01: morale modifier lines stack"
schema: acks-rulings/1
rulings: []
# Door kinds (engine 7.17.2): a row here wins over the module's doors table (Adventure/SOTN/Tables/doors.yaml) for
# `explore force-door --door-kind NAME` and is printed as "Judge's ruling (date)".
doors:
  - door: stone slab
    mod: 0
    max_helpers: 2
    date: 2026-11-22
    ruling: "Rulings S18: no -12 on ACKS II's 18+ base; the pair and up to 2 more helpers (unmodified STR bonus each)"

    base_prompt: Party/prompt/base.md
    profiles: Party/profiles/
    heuristics: Party/heuristics.md
    memory: Party/memory/
    party_notes: Party/party-notes.md
    call_dir: /tmp/claude-0/-home-user/4ce086a7-1656-539c-ba33-f82689527569/scratchpad/party
    call_log: Campaign/party-log.jsonl
    retries: 1
    rules_refused:
    - vault/Bestiaries/
    - vault/ACKS II Rules/Monster Rules/
    - vault/ACKS II Rules/Judges Journal/
hexes:
  csv: Data/hexes.csv
  numbering: CC.RR column.row; 6-mile hexes; the AX3 Borderlands regional map sheet (Library maps/ACKS_borderlands-amended-GM.tif), 01.01 at its top-left; Türos Tem 22.20
  offset: even-columns-down
  columns:
    hex: hex
    terrain: terrain
    zone: zone
    river: river
    domain: domain_ruler
    domain_kind: domain_kind
    classification: classification
    revenue: land_revenue_gp
    site: point_of_interest
    lake: lake
    encounters: encounters                  # AX1 Viaspen Forest: the module's 1d6 6+ check and table replace the RR throw (travel, search, hunt)
  roads:
    file: Data/world.json
    key: roads
  navigable_rivers:
    file: Data/world.json
    keys: []
  places: Data/places.csv
  terrain_map:
    grass:
      acks: grassland-farmland
    scrub:
      acks: scrubland-sparse
    hills:
      acks: hills-rocky
    mountains:
      acks: mountains-rocky
    forest:
      acks: forest-deciduous
    swamp:
      acks: swamp-marshy
    barrens:
      acks: barrens-rocky
    sea:
      acks: null
    lake:
      acks: null
  classification_map: {}                   # the CSV's 'wilderness' is read by the engine as unsettled (RR p. 338, engine 7.18.0)
  domains:                                 # a domain's hexes take its classification (engine 7.18.0)
  - name: Barony of the Ford
    classification: outlands               # Rulings S51 (the barony granted, day 778)
    hexes: ['26.19']
  climate:
    by_column:
      below: 99
      west: Cfb
      east: Cfb
  weather_region:
    size: 4
  settlements:
    file: Data/places.csv
    hex_column: hex
    name_column: note
    type_column: type
    types:
    - stronghold
    - town
month_end:                                 # play.py month-end (skill C4); the figures are the Rulings' (S16, S19, S46, S52, S54)
  schedule_item: month-end
  domains: [ford]                          # `acks.sh domain init ford …` once (judge-screen 9a), from Rulings S51-S54
  bank: {holder: guildhouse-bank, fee_pct: 0.25}
  incomes:
  - {to: vettius, gp: 31728, label: "the Family's syndicate take", half_when_away: {who: vettius, place: Cyfaraun}, usurpation: "1d6:1"}
  - {to: vettius, gp: 1624, label: "the Pony's honest half"}
  - {to: vettius, gp: 800, label: "the North Gate dice-houses (front)"}
  - {to: lucilla, gp: 1500, label: "the front's houses and The Mink"}
  - {to: lucilla, gp: 2750, label: "Lucilla's half of the venture company"}

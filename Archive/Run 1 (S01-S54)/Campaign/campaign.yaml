    unit: 24-mile hex, rolled at the start of each game day
    climate: hexes.climate
display: {}
party:
  structure: ai-party
  caller: rosa
  user_pc: ''
  active_players:
  - id: gideon
    pc: Characters/cotta.json
  - id: priya
    pc: Characters/vestus-the-unlikely.json
  - id: tomasz
    pc: Characters/vettius.json
  - id: rosa
    pc: Characters/lucilla.json
  - id: kwame
    pc: Characters/brennus.json
  - id: ingrid
    pc: Characters/neris.json
  pc_pdf_template: ''
  pc_pdf_source: none
  agent:
    call: Agent tool, subagent_type general-purpose, model sonnet, prompt = build's one-line pointer

schema: acks-table/1
id: ax3-old-special
title: "Old District Special Encounters"
source: {campaign: true, book: AX3, printed_pages: [77, 78]}
columns: ["1d10 (+3 after dark)", "Result"]
rows:
  - ["1", "Shop shut and barred under a stale sale sign; neighbours say the owner has been 'acting off'. Break-in: dusty stock, no foul play. Missing (1d10): 1-3 Ashera (spices), 4-6 Quellus (books), 7-10 Stateira and Mainchin (elven herbalists); may be found at [[Doppelganger Den]] (14u)"]
  - ["2", "Two Merchant Guild traders arguing (1d10): 1-3 preserved meats or cloth; 4-6 dump pottery or tools; 7-9 salt and beer price trends; 10 rare books or semiprecious stones. Listen 2d10 min: learn Cyfaraun's demand modifiers for those goods; one will buy and the other sell each"]
  - ["3", "3d10 locals pelt a man in the stocks; joining in earns 1 city rumour. Crime (1d10): 1-3 trespass on a Lake District villa; 4-6 tried to bribe the Watch; 7-9 pickpocketing a merchant; 10 innocent, crossed Liber Faunus"]
  - ["4", "Nearest sewer grate hangs open, ladder down into the Undercity; no sign who opened it, no tracks"]
  - ["5", "Terrified man fleeing 'tentacles from the pipes'; remove fear or Friendly reaction calms him; leads to the Public Latrine (12), won't enter. One patron left, paralysed, wounds on the buttocks: a [[Carrion Horror]] climbed up from the cesspool (12u). No way down from the latrine (absent magic)"]
  - ["6", "Shifty couple (2 Family carousers on a hijink) buy rumours at 3d12gp each (Borderlands or city); carry 160sp, 20gp; flee if attacked to warn the Family. [[Commoner]] AC 1 (padded), hp 3 each, dagger 11+ 1d4, ML -1, XP 5"]
  - ["7", "NPC party bound for The Mink ([[Imperial Vanguard]] or Judge's own). PCs showing adventurer gear: reaction; Friendly: drinks and 1d4 rumours; Hostile: duel challenge; else ignored. Fight: 2d4 City Watch in 1d10 rounds, wait, then arrest survivors"]
  - ["8", "Mandonio Indikortes, aged swordmaster of Krysea, challenges the toughest PC fighter (wants to die by the sword). Fighter 3, AC 5, hp 16, sword and dagger 6+, 1d6+2, ML +1, XP 50; 1gp 20sp. Spared: henchman for a PC of 3rd level+"]
  - ["9", "2d4 idle mercenaries hassle attractive PCs, demand coin, want a fight; hireable as muscle. Fighter 1, AC 2 (leather), hp 6 each, 9+, 1d6+2, ML +1, XP 10; 6sp 20cp each"]
  - ["10", "Old District notable with entourage on the corner; roll `ax3-old-notable`"]
  - ["11", "Bellos, Family comprador, sells from an alley: 2 bronze leaf goblets (25gp each), jewelled elven dagger (100gp; cursed dagger -1), dawn-redwood pegasus statuette (200gp); invites the party to The Mink. Attacked: cries out, flees; a slayer and 1d4+1 footpads arrive in 1d3 rounds"]
  - ["12", "NPC party prying open a sewer grate ([[Imperial Vanguard]] or Judge's own). Reaction; Friendly: invite to explore the Undercity together; Hostile: same offer, then betrayal; else warn off their turf. Fight: 2d4 City Watch in 1d10 rounds, arrest survivors"]
  - ["13", "1d4+1 Family footpads lower crates from a wagon into a sewer grate, 1d4+1 more below; 10 loads per footpad at the wagon (20-50). Attacked: they scatter; if one reaches The Mink, the Family's wrath falls on the party"]

schema: acks-table/1
id: ax3-temple-special
title: "Temple District Special Encounters (Cyfaraun)"
source: {campaign: true, book: AX3, printed_pages: [169, 170], note: "Adventure/AX3/City/Temple District.md"}
usage: "Roll 1d10 when a street encounter gives a Temple District special; add 3 after dark (results 11-13 only at night)."
columns: ["1d10", "Result"]
rows:
  - ["1", "Sister Ethlyn, Grey Sister crone with Prophecy, sees death over the party; for 500gp donated to the House of Mourning (#62) she communes with Calefa: up to 3 yes/no questions"]
  - ["2", "2 inquisitors of Türas crucify a Dirgion cultist before 4d10 spectators; later, Friendly reaction: they suspect a Death Cult of Dirgion in the city (#75u)"]
  - ["3", "2d6 hospitalists of Mityara heal the public; wait 1d6 turns for one free 1st level spell of choice; Friendly: a city rumour"]
  - ["4", "Milos, leprous armless old legionary, begs; 1sp+ gives Friendly reaction and a city rumour; fled the almshouse for 'the cult', leads party to the Vagrant Colony (#75u); heal him: automatic henchman, loyalty +1"]
  - ["5", "A god's messenger singles out one PC (roll ax3-temple-messenger); PC affected as by [[Fate]]; Theology names the god; worshipper with Soothsaying or Prophecy learns the fate by prayer"]
  - ["6", "5d6 sick paupers bound for the Almshouse (#60); give 1gp+ or treat them, roll 1d10: 1 save vs Death +4 or bloody flux; 10 whole party blessed 24 hours; else thanks and prayers"]
  - ["7", "Patrician funeral: litter, 8 pallbearers, 2d10 family, 1d3 bards, 1d6+1 Sisters of Mourning; at night torches and 7 bladedancers"]
  - ["8", "2d4 citizens with votive candles bound for the Shrine of the Ancestors (#68); Friendly: a city rumour and prayers for the party's ancestors"]
  - ["9", "Plague victim collapses; Healing 11+ diagnoses; touch: save vs Death or incapacitated after 1d6 hours for 1d8 days (fail by 6+ or nat 1: dies); not cured, hospitalised or burned: outbreak in 1d4 days, everyone in city 25% exposed"]
  - ["10", "A district notable on the corner (roll ax3-temple-notable) with 1d6 0-level members of the order"]
  - ["11", "(night) 1d4+1 rain-soaked travellers from Türos Drav seek the Hall of Travelers (#64); Friendly: two Borderlands rumours"]
  - ["12", "(night) 2d4+1 marshals of the Temple of Justice escort a dishevelled merchant who cries out that he is innocent"]
  - ["13", "(night) Weekly torchlight procession of 4d12 Keepers of the Hearth Fire; harming or interfering with them is punishable by death"]

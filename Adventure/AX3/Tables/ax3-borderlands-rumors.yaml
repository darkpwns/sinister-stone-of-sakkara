schema: acks-table/1
id: ax3-borderlands-rumors
title: "Random Borderlands Rumors (AX3)"
source: {campaign: true, book: AX3, printed_pages: [7, 8], note: "Adventure/AX3/Borderlands Background.md"}
usage: "An NPC with a Friendly reaction shares one rumour; a character with Loremastery starts knowing one. Roll 1d20, or 1d20+10 if the NPC is from the south (Azen Radokh, Siadanos, Türos Tellë, Türos Erín, Türos Luin, Türos Tem, Türos Aster). The verdict in brackets is Judge-only. Questions about Cyfaraun itself use the Cyfaraun rumour table (AX3 p. 44)."
columns: ["1d20+X", "Rumour"]
rows:
  - ["1", "Türos Aurë's legate wants help with a threat to sea trade. (True: [[Lair of the Manticores]])"]
  - ["2", "Orcs raid caravans along the Krysivor and probe Türos Gundan. (True: [[Lair of the Warlock]])"]
  - ["3", "Naungollë bandits raid the roads Türos Orn - Luseatum and Türos Augil - Türos Zera. (Mostly true: wererats, [[Collapsed Elven Keep]])"]
  - ["4", "The tall-spired elven capital Cyfandir still stands in the Istrith Forest. (True: [[Ruined City of Cyfandir]])"]
  - ["5", "Retreating elves hid treasures of their kingdom in grottos and caves. (True)"]
  - ["6", "Flame-clad demons haunt the Lonely Island of Lake Laman; only the wicked or foolish go there. (Partly true: an efreet, [[Ruined Wizard's Tower]])"]
  - ["7", "Türos Orn has hidden chambers unseen since the Empyrean War. (True)"]
  - ["8", "The Istrith's dawn redwoods listen and move, and will one day avenge their felled kin. (False)"]
  - ["9", "Two centuries ago, while the elven army was at war, a great old dragon took their capital and its treasure. (True: Aisoth)"]
  - ["10", "The Empire is quietly abandoning Southern Argollë as it did Dappakosea and Ivorea; Krysea will be the new border. (Mostly false)"]
  - ["11", "The Dark Wall's canyons and gullies saw many battles in the Empyrean War and the Beastman Wars. (True)"]
  - ["12", "Burial mounds of Empyrean heroes and great kings dot the grasslands east of the Krysivor. (True: [[Burial Mound of the Empyreans]])"]
  - ["13", "Valerian Bellësareus, Master of the Sword of Fire, fell in the Empyrean War's last battle and was buried with his sword in a sacred cairn. (True)"]
  - ["14", "Secret chthonic sects still make pilgrimages to Zahar's ancient temples. (True)"]
  - ["15", "A great Zaharan fortress at the Dark Wall's northern tip lies empty and plundered. (Partly true: dire orcs hold it, [[Fortress of Gorgbad]])"]
  - ["16", "Great flocks of wyverns nest in the Dark Wall's mesas and cliffs. (True: [[Wyvern Cliffs]])"]
  - ["17", "The Zaharans buried their sorcerer-kings in a desolate valley near their capital, never found. (True: [[Valley of the Sorcerer Kings]])"]
  - ["18", "On a Dark Wall cliff, monoliths like dragon's horns mark an ancient Chthonic temple. (True: [[Temple of the Stone Horns]])"]
  - ["19", "The Thrassians once ruled here; their immortal king sleeps until his race rises again. (True)"]
  - ["20", "Zahar's capital, destroyed by Azendor and Valerian a thousand years ago, lies in the sands, ruled by beastmen aping their masters. (Partly true: [[Ruins of Zahar]], Sebek)"]
  - ["21", "An ancient Zaharan shrine hides in a wooded valley of the Lusaun Forest. (True: [[Sinkhole of Evil]])"]
  - ["22", "A place in the Viaspen so evil the gods sealed it under a mountain of rock. (True: [[Buried Temple]])"]
  - ["23", "A red dragon of great age sleeps away the centuries inside Dragon's Tor. (Mostly true: a young red dragon and hobgoblins, [[Dragon's Tor]])"]
  - ["24", "Beastmen prey on caravans along the Lusaun Forest between Siadanos, Türos Tem and Türos Drav. (True)"]
  - ["25", "A fallen watchtower in the Madoan Hills, built in the Beastman War to watch the Dark Wall, is held by beastmen. (True: [[Watchtower at Eammon Mor]])"]
  - ["26", "Valerian Bellësareus lies buried in the Borderlands, and no fire at all burns on his cairn. (True)"]
  - ["27", "Above Türos Tellë a hidden underground river, the Earthway, joins the Mirmen; Azen Kairn's dwarves shipped ore on it. (True: [[Redoubt on the Earthway]])"]
  - ["28", "Orm was born in a Meniri volcano hotter than the sphere of fire, and only there can he be slain. (False)"]
  - ["29", "The Viamir Marshes grow every year, spread by some wicked miasma. (False)"]
  - ["30", "Under the Meniri lie the ruins of Azen Kairn, destroyed by the dragon Orm in the Beastman Wars. (True: [[Ruins of Azen Kairn]])"]

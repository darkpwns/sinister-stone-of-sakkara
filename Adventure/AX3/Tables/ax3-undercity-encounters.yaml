schema: acks-table/1
id: ax3-undercity-encounters
title: Undercity Encounters Table - Undercity of Cyfaraun
source: {campaign: true, book: AX3, printed_pages: [64, 65, 66, 67]}
notes: >-
  Throw 1d6 every 3 turns in the Undercity: 6+, or 5+ below the Old District; none inside an uncleared special
  location. AX3 renames (ACKS I → ACKS II MM): ankheg → Giant Acanthaspis (inferred), giant fire beetle → Luminous
  Beetle, black pudding → Black Blob, carcass scavenger → Carrion Horror, gelatinous cube → Gelatinous Mass, ghoul →
  Grave Ghoul, gray ooze → Grey Goo, green slime → Sage Slime, ochre jelly → Ochre Ooze, rot grub → Murder Maggot,
  shrieker → Shrieking Fungus, pit viper → Viper Snake, giant python → Python Snake, carnivorous fly → Giant Fly,
  yellow mold → Mustard Mold. Rhagodessa has no MM entry: [[Rhagodessa (AX3)]]. Details: [[Undercity of Cyfaraun]].
columns: ["1d100", "Monster"]
rows:
  - ["01", "[[Giant Acanthaspis]] (1d6): burrowed in through the tuff, very hungry (-5 reaction) (p. 64)"]
  - ["02", "[[Giant Ant Worker]] (2d4): carrying sludge from the sewer to their burrow (p. 64)"]
  - ["03-04", "[[Luminous Beetle]] (1d8): glowing like candles, eating insects and mould (p. 64)"]
  - ["05", "[[Bombardier Beetle]] (1d8): eating a rat corpse, still hungry (p. 64)"]
  - ["06", "[[Tiger Beetle]] (1d6) fighting [[Giant Rat]] (3d6): both attack anyone within 10’; undisturbed, rats flee at half numbers (p. 64)"]
  - ["07", "[[Black Blob]] (1): a 30’ ‘mould’ layer across the tunnel; engulfs anyone near (p. 64)"]
  - ["08-09", "[[Carrion Horror]] (1d3): on the ceiling; tentacles reach the ledges, not those crouching in the canal (p. 64)"]
  - ["10-14", "[[Giant Centipede]] (2d4): spread across the tunnel, impossible to pass (p. 64)"]
  - ["15-16", "[[Giant Fly]] (1d6): laying eggs in a sewer puddle (p. 64)"]
  - ["17-18", "[[Gelatinous Mass]] (1): full of giant rat skeletons, drifting toward the party (p. 64)"]
  - ["19", "[[Grave Ghoul]] (1d6): eating a paralysed City Watch officer at -7 of 5 hp; save him for a Watch friend (p. 65)"]
  - ["20-24", "[[Grey Goo]] (1): looks like fresh cement over a hidden door (p. 65)"]
  - ["25-29", "[[Sage Slime]] (1): large patch on the ceiling (p. 65)"]
  - ["30-31", "[[Cavern Locust]] (1d10): eating mustard mould; shriek if the party advances: wandering throw each round, arrivals in 1d4 rounds; nearby special locations alerted (p. 65)"]
  - ["32-34", "[[Wererat]] (1d8): mad Horned Rat cultists; do not know the Shrine's location (p. 65)"]
  - ["35", "[[Ochre Ooze]] (1): hungry, on the wall (p. 65)"]
  - ["36", "[[Rhagodessa (AX3)]] (1d4): hunting (p. 65)"]
  - ["37-41", "[[Murder Maggot]] (5d4): refuse mound with 2d100gp; searching it exposes the brood; crossing: Paralysis save or one maggot (p. 66)"]
  - ["42-43", "[[Shrieking Fungus]] (1d8): scream 1d3 rounds; 50% per screaming round to draw a wandering monster in 2d6 rounds; nearby special locations alerted (p. 66)"]
  - ["44", "[[Skeleton]] (3d4): fresh, improvised weapons, made by a sinkhole of evil (p. 66)"]
  - ["45", "[[Skittering Maw]] (1): attacks automatically, fights to the death (p. 66)"]
  - ["46-47", "[[Viper Snake]] (1d8): nest; automatically win initiative (p. 66)"]
  - ["48", "[[Python Snake]] (1d3): floating like logs in the sewer water (p. 66)"]
  - ["49", "[[Giant Black Widow]] (1d3): webs block the tunnel (p. 66)"]
  - ["50", "[[Giant Crab Spider]] (1d4): drop from the ceiling; -2 to the party's surprise rolls (p. 66)"]
  - ["51", "[[Giant Tarantula]] (1d3): silk-lined tunnel; attack anyone who approaches (p. 66)"]
  - ["52-56", "[[Insect Swarm]] (1, 4 HD): 300 sq ft blanket blocking the way; drawn to light (p. 66)"]
  - ["57-62", "[[Rat Swarm]] (1d4, each 1d3+1 HD) (p. 66)"]
  - ["63-64", "[[Giant Toad]] (1d4): one just tongued a sewer rat out of the dark (p. 66)"]
  - ["65-70", "[[Giant Rat]] (3d6) (p. 66)"]
  - ["71-72", "[[Giant Shrew]] (1d4): burrows through the tuff (p. 66)"]
  - ["73-74", "[[Giant Ferret]] (1d8) preying on [[Giant Rat]] (3d6): both attack anyone within 10’; undisturbed, rats flee at half numbers (p. 66)"]
  - ["75-78", "[[Mustard Mold]] (1d4): a ‘garden’ of fungus, slime and mould under a yellow haze (p. 66)"]
  - ["79", "[[Zombie]] (2d4): red-eyed vagabonds, made by a sinkhole of evil (p. 66)"]
  - ["80-100", "Special encounter of the nearest Undercity special location: Tables/ax3-undercity-special.yaml; no encounter if more than 120’ from every special location (pp. 66-67)"]

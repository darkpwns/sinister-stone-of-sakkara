id: ax3-palace-special
title: "Palace District Special Encounters"
source: {campaign: true, book: AX3, printed_pages: [190, 191, 192]}
columns: ["1d10 (+3 after dark)", "Result"]
rows:
  - ["1", "Public flogging of three men by a City Watch centurion; roll `ax3-palace-flogging`; talkative crowd: chatting gives a city rumour"]
  - ["2", "Elderly patrician on a litter (8 servants) demands the party make way; hesitate: spat at; refuse: berated; linger: 1d4+1 Watch arrive in 1d6 minutes to arrest for public outrage; attack: 4d6 Watch in 1d10 rounds side with him"]
  - ["3", "Prefect Basilio's pronouncement on the Palace steps to 100+1d100 citizens, guarded by 4d10 prefectural guards; roll `ax3-palace-pronouncement`"]
  - ["4", "1d3 patricians strolling, each with a household guard; roll `ax3-palace-patricians`; each knows a city rumour"]
  - ["5", "Attorneys Essirio Marasca and Galen Tavicus (Profession (attorney) 3) orate for patrons in a land sale; 2d10 onlookers; useful contacts for thieves"]
  - ["6", "Mob of 1d100+100 plebeian workers marches on the Palace (torches by night); roll `ax3-palace-mob`; City Watch cordon at the Palace: reaction roll for diplomacy or hostility"]
  - ["7", "120 prefectural guard legionaries in full panoply march to the nearest gate with 4 subalterns and a centurion; answer nothing, shove aside anyone in the way"]
  - ["8", "Argollëan Family spy Lazareo Ravil (Thief 4, AC 0, hp 11, 8+, 1d4, XP 80) skulks about; roll `ax3-palace-spy`"]
  - ["9", "1d4+1 City Watch escort smuggler Tarcalus (Thief 3, hp 8, XP 50), ratted out by Sand & Bones; rescued by any means: 200gp and an introduction to Liber Faunus"]
  - ["10", "Palace notable with entourage on the corner; roll `ax3-palace-notable`"]
  - ["11", "Elven courtier in leaf-embossed leather darts into an alley; following finds only a pox-covered leper pointing at the rooftops: one doppelgänger ([[Doppelganger Den]], Special Location 14u)"]
  - ["12", "2d4 household guards (0-lvl, AC 5, hp 4, short sword 11+ 1d6, XP 5) sweep the street of vagrants; suspicious parties hassled until they leave; stay: fight, Watch likely sides with the guards"]
  - ["13", "2d4 household guards beat 1d6+1 homeless beggars (hp 2, XP 5) and wreck their shelter; intervention: guards 'order' the party to deal with them and leave; beggars fear returning to the Vagrant Colony (#73u): murderers hide there"]

  - ["1", "Barge unloading: 2d4 dockworkers ([[Commoner]], hp 4 each, brawl 11+, 1d3, ML -1, XP 5; 2sp+20cp each) moving 3d4 loads; -2 reaction; Friendly: city rumour #5 + 1 random city rumour"]

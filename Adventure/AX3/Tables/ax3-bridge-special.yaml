  - ["13", "Night smuggling: Argollëan Family hood (Thief 2, AC 2, hp 6, 9+, 1d6, XP 20) + 2d4 footpads (Thief 1, AC 2, hp 3, 9+, 1d6, XP 10) carry 2 loads each from fishing boat to warehouse; warn off; attacked or Watch called: Family hostile if any escape"]

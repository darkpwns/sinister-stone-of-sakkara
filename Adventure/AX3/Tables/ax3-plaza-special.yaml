schema: acks-table/1
id: ax3-plaza-special
title: "Plaza District Special Encounters"
source: {campaign: true, book: AX3, printed_pages: [139, 140]}
columns: ["1d10 (+3 after dark)", "Result"]
rows:
  - ["1", "Painter Evanos Pir; Friendly: paints party in (pose 1d6 hours), sells it for 500gp; he is murdered in 1d4 months, then it is worth 1d10x1,000gp"]
  - ["2", "Out-of-town merchant, wagon of 3d4 loads; roll `ax3-plaza-merchant`; sells goods on the spot at 10% discount"]
  - ["3", "Fishermen parade a [[Giant Catfish]] from Lake Laman; Naturalism identifies; fresh: gills 300gp (water breathing), feelers 300gp (swift sword)"]
  - ["4", "2d4 youths make offerings to petty god Tarquellus at the Nine Shrines (Theology identifies); join in: +1 to avoid getting lost on next wilderness trip"]
  - ["5", "Nesca by a broken sewer grate: daughter Lysa (11) went down on a dare; Dungeonbashing or Engineering: grate smashed from below; Lysa lost or eaten ([[Crocodile Nest]], Judge's choice)"]
  - ["6", "Changing of the guard at the Colonnade of Triumph: Lawful fighters/paladins serving the Empire +1 to all saves for the day"]
  - ["7", "Profane graffiti on nearest imperial landmark; roll `ax3-plaza-graffiti`"]
  - ["8", "Imperial Vanguard flag (gold V on red) unveiled on the Colonnade shrine; passers-by praise them"]
  - ["9", "Someone atop the 65' Obelisk, 4d20 gawkers, 2d4 City Watch; roll `ax3-plaza-climber`"]
  - ["10", "Siadanos caravan: 20 wagons, Apollonis Meteros, 10 merchants, 40 mounted guards; 100 loads common metals (20,000gp, 10,000 st), 20 precious metals (12,000gp, 80 st), 7 semiprecious stones (7,000gp, 7 st), 3 gems (9,000gp, 3 st); robbing him is a grave risk"]
  - ["11", "Fire-scarred drunk: a drink or coin buys his tale of fire demons from the haunted tower on Lonely Island, Lake Laman (Gazetteer #14)"]
  - ["12", "Legless half-corpse in an alley; Tracking 11+: blood trail to the river; [[Speak with Dead]]: 'a giant lizard' (lizardmen, Old District #28u)"]
  - ["13", "Night rites of petty goddess Aulysëa led by Fatima with 4d10 congregants; Friendly with Fatima: invited; joiners +1 permanent to d20 rolls when Tampering with Mortality"]

schema: acks-table/1
id: ax3-old-mentenus-notes
title: "Random Undercity Research Notes (Mentenus's lair, one per turn of deciphering)"
source: {campaign: true, book: AX3, printed_pages: [91]}
columns: ["1d10", "Result"]
rows:
  - ["1", "Gloats that his followers' sacrifice in the sewer filth will win him immortality"]
  - ["2", "Avoid Faunus's smuggling dens to the south unless elimination points there; his power dwarfs Faunus's, but attention is unwelcome"]
  - ["3", "He found what the fabled Night Captain never did, the source of the old wererat plague; the Captain sleeps with his treasures beneath the Solar Citadel"]
  - ["4", "Told the minions not to search west of the river (ancient Cyfaraun stood on the east bank); Lucius disobeyed and was found half-eaten in the river; what could tear apart a wererat?"]
  - ["5", "Abimbola glimpses men living in the sewers, too far north to be Faunus's smugglers; is the half-elf hunting the Nethercity too?"]
  - ["6", "A forgotten epic in the Chapterhouse's most private library says elves once learned the secret of immortality; then men can learn it too"]
  - ["7", "An adventurer sold ancient elven bracers (bracers of armour) to the Chapterhouse unaware of their worth; Faunus had him killed for refusing his bid; a lost guide to the Nethercity"]
  - ["8", "Terkinos's pack searches noon to midnight, Abimbola's midnight to noon; immortality does not wait"]
  - ["9", "Must be seen at the Chapterhouse more to avoid the regent's suspicion; returns each full moon to pray and read the reports"]
  - ["10", "Rhapsody on the ecstasy of lycanthropy"]

schema: acks-table/1
id: ax3-building-artisan-occupation
title: "Cyfaraun Artisan Occupation"
source: {campaign: true, book: AX3, printed_pages: [54], note: "Adventure/AX3/City/Buildings of Cyfaraun.md"}
columns: ["1d100", "Artisan", "Mercantile interest"]
rows:
  - ["01-02", "Apothecary", "Buys/sells tea, coffee (herbal teas)"]
  - ["03-04", "Armorer", "Buys metals, common (bronze, iron); sells armor, weapons (armor)"]
  - ["05-06", "Baker", "Buys grain (grain); sells bread"]
  - ["07-08", "Blacksmith", "Buys metals, common (iron); sells tools (iron tools)"]
  - ["09", "Bookbinder", "Buys books, rare (unbound/damaged); sells binding and repair"]
  - ["10-11", "Bowyer/fletcher", "Buys wood, common; sells armor, weapons (bows, arrows)"]
  - ["12-14", "Brewer", "Buys grain; sells beer, ale"]
  - ["15-16", "Brickmaker", "Sells services (fired bricks and ceramic tiles)"]
  - ["17-21", "Butcher", "Buys animals (not horses); sells meats, preserved"]
  - ["22", "Cabinetmaker", "Buys wood, common and rare; sells services"]
  - ["23-25", "Candlemaker", "Buys meats, preserved (animal fat); sells candles"]
  - ["26-27", "Capper/hatter", "Buys textiles (felt, velvet); sells clothing (caps, hats)"]
  - ["28", "Carpenter", "Buys wood, common and rare; sells services (wooden structures)"]
  - ["29-31", "Chaloner/tapicer", "Buys textiles (wool); sells blankets and tapestries"]
  - ["32-37", "Clothmaker", "Buys textiles (yarn), dyes & pigments; sells textiles (wool or linen)"]
  - ["38-39", "Cobbler/cordwainer", "Buys hides/furs (leather); sells clothing (shoes, leather goods)"]
  - ["40-41", "Confectioner", "Buys grain, salt, spices; sells candy or pastries"]
  - ["42", "Cooper", "Buys wood, common and metals, common; sells barrels"]
  - ["43-44", "Coppersmith", "Buys metals, common (copper, tin); sells tools (brass, bronze, copper)"]
  - ["45", "Corder/ropemaker", "Buys textiles (fiber); makes tools (ropes, cords)"]
  - ["46-48", "Decorative artist", "Buys dye & pigments; sells services (mosaicist, painter)"]
  - ["49", "Florist", "Sells services (cut and arranged flowers)"]
  - ["50", "Gemcutter", "Buys semiprecious stones (uncut gems); sells gems"]
  - ["51-52", "Glassworker", "Sells glassware"]
  - ["53-56", "Goldsmith", "Buys/sells metals, precious (gold); sells gold jewelry"]
  - ["57-58", "Hornworker", "Buys/sells monster parts (antlers, horns, tusks, fangs, claws) and ivory"]
  - ["59-60", "Illuminator", "Sells services (illuminates books)"]
  - ["61", "Jeweler", "Buys metals precious, semiprecious stones, gems; sells trinkets, jewelry, regalia"]
  - ["62", "Locksmith", "Buys metals, common (iron); sells thieves' tools, locks, manacles"]
  - ["63-64", "Mason", "Sells services (cuts stone, builds stone buildings)"]
  - ["65", "Parchmentmaker", "Buys/sells hides/furs (skins); sells services (parchment)"]
  - ["66", "Perfumer", "Buys/sells spices; sells perfumes and incense"]
  - ["67-69", "Potter", "Sells pottery and porcelain, fine"]
  - ["70-71", "Saddler/fuster", "Buys hides/furs (leather); sells tools (saddles, saddlebags, bits, bridles)"]
  - ["72-75", "Scribe", "Sells services (codices and scrolls)"]
  - ["76", "Shipwright", "Buys wood, common; sells services (ships and boats)"]
  - ["77", "Silversmith", "Buys/sells metals, precious (silver); sells silverware, trinkets, jewelry, regalia"]
  - ["78-83", "Spinner", "Buys textiles (fiber); sells textiles (yarn)"]
  - ["84-89", "Tailor/seamstress", "Buys textiles (wool, linen) and silk; sells clothing"]
  - ["90-93", "Tanner/tawer", "Buys hides/furs (skins); sells hides/furs (leather)"]
  - ["94", "Taxidermist", "Buys hides/furs, monster parts, ivory; sells services (stuffs and mounts animals)"]
  - ["95-96", "Tinker/toymaker", "Buys metals common and wood common; sells toys and trinkets"]
  - ["97", "Wainwright", "Buys wood, common; sells services (carts, chariots, wagons)"]
  - ["98-99", "Weaponsmith", "Buys metals, common (iron); sells armor, weapons (melee weapons)"]
  - ["100", "Wheelwright", "Buys wood, common; sells services (wheels)"]

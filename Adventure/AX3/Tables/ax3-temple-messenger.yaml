schema: acks-table/1
id: ax3-temple-messenger
title: "Temple District - Divine Messenger (special encounter 5)"
source: {campaign: true, book: AX3, printed_pages: [169], note: "Adventure/AX3/City/Temple District.md"}
usage: "Judge picks the PC who suits the god; that PC is affected as by the spell Fate."
columns: ["1d10", "Result"]
rows:
  - ["1-2", "Calefa: a grey raven croaks what sounds like a PC's name, then flies off"]
  - ["3-4", "Ianna: a golden-feathered falcon soars over one PC's head, then flies off"]
  - ["5-6", "Mityara: a white dove with one fiery red tail feather lands on a sill and gazes at one PC"]
  - ["7-8", "Naurivus: a hawk, wet in sunshine or dry in rain, swoops at one PC (an explorer or ranger) and soars away"]
  - ["9-10", "Türas: a bull-horned mastiff barks at one PC (a fighter or paladin) and vanishes round the corner"]

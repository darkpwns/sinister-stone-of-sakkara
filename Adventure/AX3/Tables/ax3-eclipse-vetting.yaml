schema: acks-table/1
id: ax3-eclipse-vetting
title: "Order of the Eclipse - Result of Vetting (Destrio)"
source: {campaign: true, book: AX3, printed_pages: [173], note: "Adventure/AX3/Dungeons/Eclipse Hideout.md"}
usage: "Reaction roll 2d6 with the party leader's CHA modifier; +2 if the party has an assassin; +2 if it has a Lawful divine caster or paladin; +2 for a reputation for honourable deeds in the city; -2 for a dishonourable reputation; -4 if suspected of Chaotic members or Chthonic worship."
columns: ["2d6", "Result"]
rows:
  - ["2-", "Candidate a threat: attacked and killed if possible (now or later)"]
  - ["3-5", "Rejected as unworthy of the Order"]
  - ["6-8", "Not yet worthy; may reapply after gaining a level"]
  - ["9-11", "Worthy, but watched for 1d4 days before admission is offered"]
  - ["12+", "Invited at once to become an acolyte"]

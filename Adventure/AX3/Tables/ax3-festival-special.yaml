schema: acks-table/1
id: ax3-festival-special
title: "Festival District Special Encounters (1d10, +3 after dark)"
source: {campaign: true, book: AX3, printed_pages: [108, 109], note: "Adventure/AX3/City/Festival District.md"}
columns: ["1d10 (modified: +3 after dark)", "Encounter"]
rows:
  - ["1", "Amphitheater crowd chokes the streets: pass politely and lose 1 turn; shove through and a random encounter follows automatically"]
  - ["2", "Orisos (Krysean food-cart vendor, Sand & Bones): biscuits with honey 1cp, eggs in fish sauce 1cp, spicy sausage 3cp per 4oz, wine 2cp; Friendly reaction = 1 city rumour; questions about the Guild are reported"]
  - ["3", "Prefect Justirius Tavicus Basilio, wife Syrena and 12 prefectural guards to/from the Amphitheater, with 1d10: 1-2 Maximus, 3-4 Celictor Nuvicus, 5-6 Omnus Pluris, 7-8 Patriarch Arëtar, 9-10 Regent Aurëus Ambador"]
  - ["4", "2d4 bored patricians (AC 0, hp 4, dagger 11+, 10gp+20sp each) and as many household guards (AC 5, hp 5, short sword 11+, 1d6); 1d10: 1-3 want a wager on the games, 4-6 ask the way to Gambler's Row, 7-9 want the Silk Pony pit-fight password, 10 abuse the party (kill one, kill all or be wanted for murder)"]
  - ["5", "Agilus Balventius (lame trainer, Fighter 3) recruits fighters for House Nuvicus; refers takers to the school (#22)"]
  - ["6", "Corentin (Sand & Bones hood, Thief 2) sizes up the toughest fighter: come to the Silk Pony at the next full moon and say 'Corentin' to fight in a Blood Moon bout"]
  - ["7", "4 Sand & Bones thugs (Assassin 1, AC 2, hp 4, morning star 10+, 1d10+2) beat merchant Crispus Critonius (owes Selene 1,200gp); rescued, he gives 3d4 loads of merchandise, the password 'Kruan Elen' and a rumour, then leaves town; surviving thugs = Guild enmity"]
  - ["8", "Drunken brawl over a dice game on Gambler's Row: 1d4 louts a side, unarmed (AC -2, hp 4, punch 13+ 1d3 nonlethal, kick 15+ 1d4 nonlethal); Watch arrives in 3d6 rounds and arrests everyone"]
  - ["9", "AX3 prints two 9s (Judge's call: 1d2): (1) three-way brawl of school fans, 2d4 a side (AC 0, hp 4, punch 11+, kick 13+), Watch in 3d6 rounds; (2) 4d4 drunk arena fans: 1d10 1-5 invite the party along, 6-10 take them for rival fans and pick a fight"]
  - ["10", "A notable alone on the corner, 1d10: 1 Maximus, 2 Selene, 3-4 Jonus Krusaro, 5-6 Thana Nyssand (AX3 prints 4-6; Judge's call), 7-8 Celictor Nuvicus, 9-10 Mara Rëavus; chance or design?"]
  - ["11", "2 City Watch officers (AC 5, hp 4, 11+, 1d6) face 3 Sand & Bones hoods in an alley; first side to take a casualty flees; helping one side + Friendly reaction = introduction to its leader; the other side turns hostile if any escape"]
  - ["12", "2d4 Sand & Bones hoods wreck a shop that missed its protection money: 1 load of merchandise thrown into the street each round for 10 rounds, taken afterwards; interfering or looting = Guild hostility if any escape"]
  - ["13", "Amira (debtor fleeing the Guild) begs for help; 1d4 hoods arrive in 1d10 rounds: hand her over (10gp reward), buy out her debt (100gp) or fight (Guild hostility if any escape)"]

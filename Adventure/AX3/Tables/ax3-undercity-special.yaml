schema: acks-table/1
id: ax3-undercity-special
title: Undercity Special Encounters - by nearest special location (Undercity result 80-00)
source: {campaign: true, book: AX3, printed_pages: [66, 67]}
notes: >-
  Not rolled: use the row of the special location nearest the party when the Undercity table gives 80-00. More than
  120’ from every special location: no encounter. Statlines are in the district notes named; see also
  [[Undercity of Cyfaraun]].
columns: ["Nearest special location", "Encounter"]
rows:
  - ["11u The Mink (Old District)", "Argollëan Family smugglers moving contraband to an underground warehouse: a robber (Thief 3), 1d3 hoods (Thief 2), 1d6 footpads (Thief 1) with one load of merchandise. They avoid violence, but this is their turf (AX3 p. 73) (p. 66)"]
  - ["13u Shrine of the Horned Rat (Old District)", "8 [[Wererat]]s of the Cult of the Horned Rat in human form, filthy, tapping walls for the way into the Nethercity; turn ratman if fighting starts. Noon-midnight: Terkinos (Mage 3 wererat), two Mage 1 wererats, five ordinary. Midnight-noon: Abimbola (Fighter 4 wererat), two Mage 2 wererats, five ordinary (AX3 p. 88) (pp. 66-67)"]
  - ["14u Doppelgänger Den (Old District)", "A [[Doppelgänger]] from the den on an errand: 1d3 which doppelgänger, 1d6 its current form; avoids a fight if it can (AX3 p. 92) (p. 67)"]
  - ["28u Lizardman Lair (Festival District)", "A [[Lizardman]] warrior dragging an unconscious dockworker (-3 of 3 hp) to the lair. Treat his mortal wounds and he tells of being seized at the Docks by something scaly from the water (AX3 p. 102) (p. 67)"]
  - ["36u Catacombs of the Patriarchs (Bridge District)", "1d4 knights of the Winged Sun with torches, patrolling against vermin of every kind, two-legged included (statline Bridge District, AX3 p. 131) (p. 67)"]
  - ["45u Crocodile Nest (Plaza District)", "A tough green scale torn off on a rusted grate: Animal Husbandry or Naturalism shows a crocodile or giant lizard at least 30’ long; a Tracking throw follows the blood trail to the lair (AX3 p. 138) (p. 67)"]
  - ["50u Tower of Knowledge (Tower District)", "1d4 theurgists (Mage 3) patrol near the Tower basement, one with a staff under continual light (ACKS II perpetual illumination), the rest with daggers; the regent suspects traffic between Tower and Undercity. Adventurers look suspicious: may be taken in for questioning (AX3 p. 145) (p. 67)"]
  - ["68u Catacomb of the Ancestors (Temple District)", "1d4 knights of the Winged Sun with torches half-heartedly checking the vagrants' tales of chaotic cultists below (p. 67)"]
  - ["69u Eclipse Hideout (Temple District)", "A deathbringer (Assassin 3) shadows the party from beyond its light to judge whether it threatens the Order. Confronted: claims to be a lay servant of the Sisterhood of Mourning patrolling the Undercity (the sisters confirm it). Kill him and the Order of the Eclipse's righteous retribution follows (AX3 p. 166) (p. 67)"]
  - ["75u Vagrant Colony (Lake District)", "A vagrant mad with fear splashes past, takes the party for Dirgion's cultists and flees. Caught and calmed: evil cultists have settled in the colony and murdered its leader (AX3 p. 179) (p. 67)"]
  - ["78u Prefect's Dungeon (Palace District)", "A hood in rags with broken manacles, escaped from the Prefect's Dungeon. Help him out: his and his syndicate's friendship (1d10: 1-4 Argollëan Family, 6-8 Sand & Bones, 9-10 lone wolf; 5 unassigned in AX3, Judge's call: Argollëan). While escorting him throw 1d6 every minute (6 rounds): 5+ brings 1d4+1 City Watch officers after him. Hand him to the Watch: 40gp (AX3 p. 187) (p. 67)"]
  - ["81u Barracks Vault (Palace District)", "2d4 Prefectural Guards with torches order the party to halt for questioning: rumours of ruffians near their vault (statline inferred: the legionaries of city encounter 81-84) (AX3 p. 188) (p. 67)"]

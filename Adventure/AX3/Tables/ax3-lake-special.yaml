schema: acks-table/1
id: ax3-lake-special
title: "Lake District Special Encounters"
source: {campaign: true, book: AX3, printed_pages: [181, 182]}
columns: ["1d10 (+3 after dark)", "Result"]
rows:
  - ["1", "Wealthy patrician fancies the highest-Cha adventurer, sends an invitation; roll `ax3-lake-invitation`"]
  - ["2", "Gargoris the Halfman, maimed beggar and Argollëan Family spy: reports the party if the Family is hostile, else fishes for news; Friendly: 1 city rumour"]
  - ["3", "Drakomir and Ambador household guards brawl; Watch platoon ends it in 1d10 rounds, arrests no guards but may arrest intervening adventurers"]
  - ["4", "Elegant stranger hugs an adventurer as an old friend; roll `ax3-lake-stranger`"]
  - ["5", "3d6 domestic servants; Friendly: 1 city rumour and villa access for sale; employer 1d10: 1-4 Drakomir, 5-7 Ambador, 8-10 Liber Faunus"]
  - ["6", "2d4 youths (1d4+11 years) beating a dog (dies in 1d10 rounds); rescue it: 1d6 turns later household guards equal to the party confront them; a fight brings 4d6 City Watch in 1d10 rounds"]
  - ["7", "1d4 patricians (2 household guards each) invite the party to the Charter Inn; roll `ax3-lake-patricians-want`; attacked: they flee, 4d6 City Watch in 1d10 rounds"]
  - ["8", "Bard Avaro Lagnuas, thrown out of the Charter Inn; Friendly: 2 Borderlands rumours; leaves in 1d10+10 minutes when 2d4 City Watch arrive"]
  - ["9", "1d4+1 drunk patricians, 2d6 guards and servants, boarding a pleasure barge; Cha 16+ with Mystic Aura or Seduction: invitation; they know 2d4 Borderlands rumours"]
  - ["10", "Notable family walks by with a guard captain and 1d6+2 household guards; roll `ax3-lake-family`"]
  - ["11", "Drunken mage showing off on a pleasure barge; each round watched roll `ax3-lake-drunken-mage` (+1 per consecutive round)"]
  - ["12", "Alley duel: Jonus Ambador (Bard 4, AC 3, hp 17, 7+, 1d6+2) vs Malynurio Drakomir (Fighter 3, AC 2, hp 18, 7+, 1d6+4), with seconds"]
  - ["13", "Cowled figures attack if they outnumber the party or it looks weak; roll `ax3-lake-cowled-figures`; captives can lead to the lair"]

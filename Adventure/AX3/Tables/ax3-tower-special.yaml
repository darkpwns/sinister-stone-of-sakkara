schema: acks-table/1
id: ax3-tower-special
title: "Tower District Special Encounters"
source: {campaign: true, book: AX3, printed_pages: [148, 149, 150]}
columns: ["1d10 (+3 after dark)", "Result"]
rows:
  - ["1", "2d12 cheerful, smelly pedestrians with towels and scrubbers bound for the Public Baths ('free admission day'); urge attractive PCs to join"]
  - ["2", "Argollëan Family courtesan (CHA 2d4+10) offers the lowest-CHA PC a massage at the baths: 5sp/hour or 2gp/evening; Friendly (Seduction applies): city rumour; tip 3gp+: invited to the Mink"]
  - ["3", "Scholar Erantheus Celicato (0-lvl, AC -1, hp 2, XP 5) debates philosophy with 1d4+1 apprentices; meaningful contribution: invitation to join the Tower"]
  - ["4", "Omen bird shadows the party for 24 hours; roll `ax3-tower-bird-omen`; Beast Friendship: recruit it with a successful reaction roll"]
  - ["5", "Magic mouth in a doorway insults a random PC by name for 1 turn; 1d4 pedestrians stop to laugh each round"]
  - ["6", "Tower of Knowledge looks like a 75' pine (illusory terrain); disbelief: save vs Spells; ends after 1d6 turns"]
  - ["7", "Exiled dwarven machinist Hurgon Wharto (lvl 3, AC 5, hp 12, crossbow 8+, XP 50) with ornithopter; Friendly: demonstration; PCs 3rd+ recruit at +1"]
  - ["8", "Befuddled sage Tirius Mirasca (0-lvl, hp 2, XP 5) lost; examines magic items: Alchemy 7+, Magical Engineering 7+, Loremastery 11+; Friendly: Borderlands rumour"]
  - ["9", "1d4+1 bullies ([[Commoner]], AC 0, hp 4, punch 11+ 1d3 / kick 13+ 1d4 nonlethal, XP 5) beat apprentice Nicus Cato (Mage 1, hp 3, XP 10); they flee if opposed; recruit Nicus at +1 if promised advancement"]
  - ["10", "Tower notable on the corner with 1d4 apprentices and 1d4+1 guards; roll `ax3-tower-notable`; Friendly: Borderlands rumour, invitation to join"]
  - ["11", "Bloody Ancient Zaharan spellbook in an alley: choking grip, darkness, deathless minion, necromantic potence, dismember; Tower demands it; Mentenus destroys it"]
  - ["12", "Explosion in an abandoned building: save vs Blast or 2d6 damage; illicit workshop, burned mage: 1 hour salvages 2d6x100gp equipment + 2d6x100gp; Tower pays 25gp for the corpse"]
  - ["13", "Illicit duel: Valeria Victa vs Maharbal Bar Abedsh (Mage 5 each, XP 200 each); any interference and both attack the interlopers"]

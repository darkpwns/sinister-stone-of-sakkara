schema: acks-table/1
id: ax3-rumours
title: "Cyfaraun Random Rumour Table (AX3)"
source: {campaign: true, book: AX3, printed_pages: [43, 44, 45], note: "Adventure/AX3/City/Organizations of Cyfaraun.md"}
usage: "Friendly reaction from a Cyfaraun NPC: one rumour. A character with Loremastery starts play knowing one (may share it). Also found through hijinks. Player text is the Rumour column only; the last two columns are Judge-only."
columns: ["1d20", "Rumour", "Truth (Judge)", "Behind it (Judge)"]
rows:
  - ["1", "Beheaded bodies of lepers and vagrants were found floating in the river by the south wall the morning after the last new moon; the Watch is not looking, since nobody cares for outcasts.", "True", "Death cult of Dirgion: kills on the new moon, keeps the skulls for its altar, dumps the bodies in the sewer trench that drains to the river. Vagrant Colony and Death Cult Hideout #75u ([[Lake District]])."]
  - ["2", "Adventurers who want to prove themselves as gladiators before the next festival should try the Silk Pony: good coin if you don't mind blood.", "True", "Win the trust of the Silk Pony staff to fight in or bet on its unsanctioned blood sports. Silk Pony Inn #25 ([[Festival District]])."]
  - ["3", "Prefect Basilio has gone mad and hired assassins to kill merchants he suspects of smuggling; bodies dumped in the river as a warning.", "Mostly false", "He is going mad (side effects of being raised from the dead) but has hired no assassins. Palace #80 ([[Palace District]])."]
  - ["4", "Selene Nictorian of the Silk Pony has a heart of steel: debtors who don't pay her vanish and are never found.", "True", "Debtors are made to fight in the cellar bouts; the dead go to a room where Maximus secretly eats them (Selene and the guild do not know what he does). Silk Pony #25."]
  - ["5", "River pirates preying on bargemen are behind all the bodies in the river; their base is upstream near the mountains.", "False", "-"]
  - ["6", "Lanista Celictor Nuvicus bought a monstrous crocodile and other beasts for the next seasonal festival, though he denies it; maybe a surprise to upstage Maximus.", "True", "He staked much of his wealth on lizardman gladiators and a giant crocodile from Arganos (smuggled with Liber Faunus); they overpowered their handlers on arrival at night and fled into the sewers. He denies it to avoid scandal. Lizardman lair #28u, crocodile den #45u."]
  - ["7", "The Argollëan Family has stepped up its shadow war on Sand & Bones, murdering merchants who would use Selene's services instead; hence the mutilated corpses on the banks.", "False", "The corpses are the death cult's (#75u) and the doppelgängers' (#14u). Rows 6, 7 and 16 share the book's note on Celictor's escaped beasts."]
  - ["8", "Everyone loves Maximus, the Strong Silver Sword, for fielding beastmen; everyone except the rival lanistae Celictor Nuvicus and Omnus Pluris. His beastmen made the festivals more exciting and lucrative.", "True", "Maximus has Cha 18; his beastman gladiators have made the games far more exciting. Silk Pony #25; his school #23."]
  - ["9", "For business go to the Mink; for gambling and whoring without end, the Silk Pony; for blue blood with coin, the Noble Charter Inn, with visits from Ianna's sacred courtesans.", "True", "The Mink #11 ([[Old District]]), Silk Pony #25, Imperial Charter Inn #74 ([[Lake District]]; called 'Noble Charter Inn' in the rumour)."]
  - ["10", "A few young wizards have taken a great interest in the city's rats: exterminators, or a mad rat cult?", "True", "Provost Mentenus Cavië and his apprentices worship the Rat God and have become wererats, to survive the Undercity while seeking the Nethercity named in captured tomes. Shrine of the Horned Rat #13u ([[Old District]])."]
  - ["11", "The Patriarch bars visits to the Night Captain's tomb because tomb raiders desecrated it on his watch; if people saw, he would be shamed out of the city.", "False", "-"]
  - ["12", "The regent of the wizards' chapterhouse wants to meet adventurers heading past the border forts into the Waste, and pays for credible news of threats from there.", "True", "Regent Aurëus Ambador (master of the College of War) hands out sigil-marked iron spikes to hammer at points of interest; pays 100-1,000gp per verified point. Tower of Knowledge #50 ([[Tower District]], AX3 pp. 145-146)."]
  - ["13", "The Order of the Eclipse beheads the bodies in the river; beware those who serve the Lady of Fortune, a dark goddess of buried riches.", "False", "The Order is real but not Chaotic: it kills only criminals unpunished by law. Eclipse Hideout #69u ([[Temple District]])."]
  - ["14", "Nicean wine merchant Vasan Tikala refuses to sell his best wine at the Emporium; he sells only at night by the river to dodge thieves and tax men, but with the bodies turning up no one will meet him.", "True", "Doppelgängers killed Vasan and his two assistants and took their places; they meet buyers at night by a sewer outlet to kill them and drag bodies and valuables to their den. Doppelgänger Den #14u ([[Old District]])."]
  - ["15", "Nobody has seen them in years, but the Brotherhood of Knives is still in business as killers for hire.", "Mostly true", "The Brotherhood's members were slain and replaced by the doppelgängers (#14u)."]
  - ["16", "Bargemen unloading a secret night cargo at the north-west river pier were killed by something; a drunk chirurgeon swears the bite marks are a dragon's. The cargo is gone.", "Mostly true", "Not a dragon: Celictor's escaped giant crocodile and lizardmen (see row 6). #28u, #45u."]
  - ["17", "Liber Faunus is no ordinary merchant but one of the most dangerous men in the city: costly to work with, true to his word if you keep yours, cheaper than the tax man. Never smuggle into the Old District without his blessing.", "True", "He secretly heads the Argollëan Family. The Mink #11/11u."]
  - ["18", "The city wants new gladiators against Maximus's beastmen; beating one of his ogres alone on the sands wins the city's love, and the few who did are now rich and free.", "True", "As row 8. Silk Pony #25; Amphitheater #20."]
  - ["19", "Don't trust the chapterhouse regent: he sends naive adventurers into the Waste to die, and hexes those who refuse.", "False", "As row 12 (he is honest)."]
  - ["20", "Poor Tavus Ionicus, last of a ruined landless patrician house, went mad and lost what little he had; maybe he lives with the lepers in the undercity.", "True", "A prophetic gift gave him dreams of the Nethercity that drove him mad; he drew scarab-and-worms motifs on the sewer walls. Deep in the Vagrant Colony (#75u) lie his beheaded body (the death cult's first victim), his drawings and a note begging the finder to have the Grey Sisters give him funeral rites."]

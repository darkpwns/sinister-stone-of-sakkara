schema: acks-table/1
id: ax3-irritating-rumours
title: Random Irritating Rumours - the Imperial Vanguard (substitute for any city rumour)
source: {campaign: true, book: AX3, printed_pages: [201]}
notes: >-
  Whenever a city rumour would be given, the Judge may give one of these instead: praise of a rival party goads
  adventurers. Truth value in brackets (AX3 marks only some; unmarked = not stated). See [[Imperial Vanguard]].
columns: ["1d10", "Rumour"]
rows:
  - ["1", "Gabriol Eirenikos is no mage but something different, something more. [truth not stated]"]
  - ["2", "Aghilas was suckled by a lioness, beasts bow their heads under his gaze, and he is born to be a king. [partly true]"]
  - ["3", "No kinder soul walks Cyfaraun's streets than Asrya Raija. [truth not stated]"]
  - ["4", "Irial Ui Aedan is the elf-lord Aedon Lann reborn, come to reclaim the Waste for the elves. [false]"]
  - ["5", "Nikolaus the Nicean is chosen of the gods: age, fear, sickness and poison never touch him. [truth not stated]"]
  - ["6", "Valenus Mirens only plays the gentleman-scholar: he is a powerful sorcerer trained at the Tower of Knowledge. [mostly false]"]
  - ["7", "Every member of the Imperial Vanguard is sworn to the Emperor, a Talon of the Eagle. [false]"]
  - ["8", "The Vanguard gave a whole treasure haul to the Orphanage of the Keepers; praise Mityara and the Vanguard! [true: they needed the reserve XP]"]
  - ["9", "Their name is written in gold across the Logos itself; the gods sent such heroes for these times. [false]"]
  - ["10", "Come to join the Vanguard? A notice at the Mercenary Guildhouse says they are hiring henchmen. [true]"]

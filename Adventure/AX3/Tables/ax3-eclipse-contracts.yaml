schema: acks-table/1
id: ax3-eclipse-contracts
title: "Order of the Eclipse - Contract of Righteous Retribution"
source: {campaign: true, book: AX3, printed_pages: [175, 176], note: "Adventure/AX3/Dungeons/Eclipse Hideout.md"}
usage: "Each week roll 1d4 per deathbringer PC in Cyfaraun; on 4 an assignment. Roll 1d6 here; strike each contract once used; a used number rolls a fresh contract on ax3-retribution-reason and ax3-retribution-petitioner. Pay: 500gp per level of the target."
columns: ["1d6", "Result"]
rows:
  - ["1", "Balkar, Krysean theurgist (Mage 3): bewitched young Oma into acts against her will until she killed herself; sought by her father, a travelling merchant, with her journal"]
  - ["2", "Kalbo 'Baldy', City Watch subaltern (Fighter 4): killed merchant Vel at the gate by night for refusing a bribe; sought by Vel's adult son, who escaped and came back in disguise"]
  - ["3", "Larce, mercenary hero (Fighter 4): killed fellow adventurer Aranth over splitting a payment; sought by Aranth's wife, who saw it at her door"]
  - ["4", "Virathos, Krysean trader (Venturer 2): killed horse trader Azeo over a stallion's price; sought by Azeo's daughter, who overheard"]
  - ["5", "Hrad the Blood Axe, Jutland barbarian (Barbarian 4): killed young noble Umic in an illicit duel in The Mink; sought by Umic's father, patrician Zeodan Lausa, avoiding scandal"]
  - ["6", "Una, the mysterious woman (Witch 4) of the cursed Thelesa villa south-west of the city: frightened Kyrus Lipsus's horse so he fell and died; sought by Lady Lipsus"]

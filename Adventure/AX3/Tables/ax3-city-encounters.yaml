schema: acks-table/1
id: ax3-city-encounters
title: City Encounters Table - Cyfaraun streets (1d100, +30 after dark)
source: {campaign: true, book: AX3, printed_pages: [59, 60, 61, 62, 63]}
notes: >-
  Roll 1d100 when a street encounter throw succeeds (see [[Streets of Cyfaraun]]); add 30 after dark, so results run 01-130.
  Statlines are converted to ACKS II (MV as combat / exploration speed; XP from the ACKS II table, class level as HD).
  "Hoods"/"footpads" in 119-130 use the 109-112 statlines of the syndicate that holds that bank: east of the Mirmen the
  Argollëan Family, west of it Sand & Bones. The JJ's generic Settlement Encounters Table (JJ pp. 81-84) is the ACKS II
  edition of this table; where it converts a quantity (stone of merchandise) it is quoted in brackets.
columns: ["1d100 (modified: +30 after dark)", "Result"]
rows:
  - ["01-04", "4d10 beggars (many disabled veterans) wall off the avenue demanding alms. 2d4 City Watch disperse them violently after 1d10 minutes. Give ≥1gp before the Watch arrives: one city rumour. Bribe or drive off the Watch: invited to meet their friends at the Vagrant Colony (Lake District #75u; AX3 prints #73u). Beggars: 0-level, MV 20’/60’, AC 0, HD 1-1, hp 2 each, no damaging attack, NM, ML -2, AL N, XP 5. Watch officers: as [[Patroller]] regulars, MV 30’/90’, AC 5 (chain, shield), HD 1-1, hp 4 each, spear or short sword 11+, 1d6, NM, ML +1, AL L, XP 5; 2sp + 20cp each. (AX3 pp. 59-60)"]
  - ["05-08", "A merchant's wagon loses a wheel and spills 3d4 loads of merchandise [JJ: 3d100 st; type on Random Merchandise, RR p. 380]; merchant and teamster argue over the blame. Steal a load quietly: Pickpocketing throw at +4. Help repair and reload: 30gp and a city rumour. (AX3 p. 60)"]
  - ["09-12", "A bard on a stool serenades a crowd of 1d10. Tip ≥1gp: 1d3 anecdotes from the Borderlands rumour table. Tip ≥20gp and a Friendly reaction: he pledges to sing of the party's deeds (each such bard: 1 in 6 the traveller of 29-32 asks for the party instead). (AX3 p. 60)"]
  - ["13-16", "Two wagons collide and block the road; the merchants shout, neither backs up. The party loses 1 turn pushing through 2d100 gawkers. Make an additional encounter throw. (AX3 p. 60)"]
  - ["17-20", "Street magician entertains 3d10 locals: Prestidigitation smoke-monsters gossiping about notables. Easy henchman (+2 to hire) unless the party shows him up before the crowd. Mage 1; STR 10, INT 16, WIL 11, DEX 14, CON 9, CHA 13; MV 40’/120’, AC 1, HD 1, hp 4, dagger 10+, 1d4, M1, ML +1, AL N, XP 10; 1 first-level spell/day. See [[Streets of Cyfaraun]] 17-20. (AX3 p. 60)"]
  - ["21-24", "1d4 proselytizers. 1d8 deity: 1 Ammonar, 2 Calefa, 3 Ianna, 4 Istreus, 5 Mityara, 6 Naurivus, 7 Turas, 8 minor or foreign (Judge's choice). Each character who listens 1 turn gets a free 1st- or 2nd-level spellcasting of his choice. They know one city rumour (Friendly reaction). (AX3 p. 60)"]
  - ["25-28", "Town crier with the day's news (festivals, market hours, temple rites). Friendly reaction: 1d3 Borderlands rumours and 1d3 city rumours. (AX3 p. 60)"]
  - ["29-32", "A traveller asks if they are the famous Imperial Vanguard ([[Imperial Vanguard]]). Yes: wants autographs; no: wishes them Calefa's blessing and equal fame. Friendly reaction: one city rumour. 1 in 6 per bard the party has hired (09-12) that he names the party instead. (AX3 p. 60)"]
  - ["33-36", "1d4 City Watch (as 01-04) march past. Visible weapons or armour: stopped and asked their purpose. Argumentative or notorious party: the Watch tries to apprehend; if outnumbered it whistles up 2d6 more watchmen, arriving in 1d4 rounds. (AX3 p. 60)"]
  - ["37-40", "A careless pedestrian: one random PC saves vs Blast or is bumped. 25% he is a pickpocket who has just taken that character's coin purse [JJ: Thief 1, Pickpocketing 13+]. (AX3 p. 60)"]
  - ["41-44", "Two rash patricians race light horses through the street, wrecking carts and stalls. Each PC saves vs Blast or is splattered with filth. They ride 1d10 blocks, salute and split to dodge the Watch. Catch them and hand them over: 10gp reward, but 1d4 nights later 2d4 hoods (109-112 statline of the local syndicate) are hired to beat the party. Patricians (2): Fighter 1; MV 80’/240’ mounted, AC 2 (leather), HD 1, hp 7, 6, sword 10+, 1d6+1, F1, ML +1, AL N, XP 10; Diplomacy, Riding; [[Light Horse]], military saddle, 6gp + 20sp each. (AX3 p. 60)"]
  - ["45-48", "1d4 bards and their manager (a venturer) on the way to a show; 1d10 venue: 1-3 the Emporium (#7), 4-5 the Mink (#11), 6-7 the Silk Pony (#25), 8-9 the “Noble Charter Inn” (inferred: the Imperial Charter Inn, Lake District #74), 10 a patrician's home. Friendly reaction: a city rumour and an invitation to watch. (AX3 p. 60)"]
  - ["49-52", "Wild-eyed vagrant in rags; 1d10: 1-5 rants about a death cult murdering his friends; 6-8 takes the party for the cult and follows them screaming “kill me, too!”; 9-10 screams and collapses: Healing throw shows slow pit viper venom, neutralize poison revives him. Revived, or Friendly reaction otherwise: offers to lead the party to the Vagrant Colony (Lake District #75u). (AX3 p. 61)"]
  - ["53-56", "Spilled rucksack of ruined papers; a Deciphering throw (ACKS I Read Languages; 4+ for thieves and bards of 4th+) recovers two: a journal with 1d4+1 Borderlands rumours, and a treasure map to a Borderlands point of interest (Judge's choice). (AX3 p. 61)"]
  - ["57-60", "Refuse hurled from a tenement: each PC saves vs Blast or is covered in waste, then saves vs Death (ACKS I Poison) at +4 or catches bloody flux for a week [JJ: symptomatic after 1d4 days, incapacitated a week; see Diseases, JJ p. 84]. (AX3 p. 61)"]
  - ["61-64", "A friendly NPC the party knows (Judge's choice) walks past without a greeting. Accosted, 1d10: 1-5 apologizes, preoccupied; 6-10 a vague “How have you been, chief?” and leaves: the real NPC is dead and this is a [[Doppelgänger]] (Doppelgänger Den, Old District #14u). (AX3 p. 61)"]
  - ["65-68", "A blocked sewer grate has pooled stinking refuse. Clearing it shows it was deliberately sealed; opened by a spell that opens locks (ACKS I knock; ACKS II: battering ram, Judge's call) or 1 turn of tool-work. Leads to the Undercity ([[Undercity of Cyfaraun]]). (AX3 p. 61)"]
  - ["69-72", "Rampant beast; 1d10: 1-3 team of 1d4 [[Mule]]s braying, kicking, biting; 4-6 a heavy draft horse ([[Heavy Horse]]) loose among the stalls; 7-9 a huge ox (STR 18; [[Huge Herd Animal]]) stampeding; 10 a Somirean [[Elephant]] gone wild. Calming it: owner pays 20% of the animal's cost (RR prices: draft mule 20gp → 4gp each, heavy draft horse 40gp → 8gp, draft ox 40gp → 8gp, riding elephant 1,500gp → 300gp; Judge's call on type) and a city rumour. (AX3 p. 61)"]
  - ["73-76", "A wagon in an alley beside a store; 2d4 labourers unload 3d4 loads of random merchandise [JJ: 6d100 st, RR p. 380] under the owner's eye. Friendly reaction: he buys and sells that merchandise and shares a city rumour. (AX3 p. 61)"]
  - ["77-80", "Shabby man with a sack dashes across from alley to alley; 1 round later a watchman emerges, confused. Point the way: a contact in the Watch. Mislead him: the thief returns 1d10 turns later to thank them; Friendly reaction: introduction to his syndicate (east of the Mirmen the Argollëan Family, west Sand & Bones). Stolen goods: Precious Merchandise table if needed. Thief 2; MV 40’/120’, AC 2 (leather), HD 2, hp 6, pair of daggers 9+, 1d4, T2, ML +2, AL N, XP 20; Climbing 5+, Hiding 16+, Listening 13+, Sneaking 14+ (ACKS II Thief 2 18+/16+, Skulking +2), backstab +1 die; Gambling, Skulking; sack of 2,500sp. (AX3 p. 61)"]
  - ["81-84", "Patrol of 10 Prefectural Guard legionaries and a crested subaltern. Known criminals: they come to arrest; otherwise patrolling. Stand aside: no trouble; don't: shoved aside with shields and spear butts. A fight brings 3d6 City Watch in 1d4 rounds; arrest means charges of assault, mayhem and/or murder. Legionaries: Fighter 1; MV 20’/60’, AC 7 (banded plate, shield), HD 1, hp 6 each, spear or short sword 10+, 1d6+1, F1, ML +3, AL L, XP 10; 2sp + 20cp each. Subaltern: Fighter 3; STR 13, CHA 13; AC 8 (plate, shield), HD 3, hp 13, 8+, 1d6+3, F3, ML +3, XP 50; Command; 1gp + 20sp. (AX3 p. 61)"]
  - ["85-88", "A crossbow bolt kills a pedestrian beside the party; the assassin is hidden on the roof above. 1d10: 1-2 the party was the target and he shoots again; 3-4 victim was a murderer slain by the Order of the Eclipse (righteous retribution); 5-6 an Old District merchant informing on the Argollëan Family, killed for Faunus; 7-8 a Festival District merchant who refused Sand & Bones protection money; 9-10 he snooped in the Undercity and Mentenus had him killed. Assassin 5; DEX 16; MV 40’/120’, AC 4, HD 5, hp 23, crossbow 5+ or sword and dagger 6+, 1d6+2 + poison, F5, ML +1, AL N, XP 200; rockfish venom on bolts. See [[Streets of Cyfaraun]] 85-88. (AX3 pp. 61-62)"]
  - ["89-100", "Special! Roll 1d100 on the current district's special encounter table: Old Tables/ax3-old-special.yaml, Festival Tables/ax3-festival-special.yaml, Bridge Tables/ax3-bridge-special.yaml, Plaza Tables/ax3-plaza-special.yaml, Tower Tables/ax3-tower-special.yaml, Temple Tables/ax3-temple-special.yaml, Lake Tables/ax3-lake-special.yaml, Palace Tables/ax3-palace-special.yaml. (AX3 p. 62)"]
  - ["101-104", "Street-corner prostitute (CHA 3d4+4) propositions a random PC: a few moments 5cp, a night 2sp. Friendly reaction (Seduction applies): a city rumour. Tippers of 3gp+ invited to the Silk Pony (#25) or the Mink (#11). (AX3 p. 62)"]
  - ["105-108", "A corpse in an alley; 1d10: 1-2 stabbed through the heart and beheaded: Black Lore of Zahar recognizes Dirgion's doombringers (#75u); 3-4 partly eaten: Healing throw 11+ shows bites of a man-sized creature with big fangs and strong jaws (Crocodile Nest, #45u); 5-7 throat cut, bloody “A” on the brow: Argollëan Family (AX3 p. 73); 8-10 mouth stuffed with sand: Sand & Bones (AX3 p. 102). (AX3 p. 62)"]
  - ["109-112", "After dark, an Argollëan Family crew (slayer, 2 hoods, 3 footpads) fights a Sand & Bones crew (torturer, 3 hoods, 2 footpads). Uninterrupted, the first side to take 2 casualties flees. Helping a side: its gratitude, and on a Friendly reaction an introduction to its leader; the other side turns hostile if any of its members escape to report. Statlines: [[Streets of Cyfaraun]] 109-112. (AX3 p. 62)"]
  - ["113-114", "No entry in AX3 (the table skips from 109-112 to 115-118). Judge's call: run 109-112."]
  - ["115-118", "City Watch raid: 3 veteran infantry and 3 composite bowmen ram a door, burst in after 1 round and arrest the occupants. 1d10: 1 a chaotic cult at profane rites; 2-4 a brothel (1d10 prostitutes, 1d6 patrons) behind on its bribes; 5-7 a gambling house (1d3 bookies, 1d10 gamblers) that cheated a watch officer; 8-10 a contraband warehouse (1d4 smugglers, 3d4 loads of random merchandise [JJ: 3d100 st]). Characters with Lightless Vision (or elven senses for secret doors) see someone slip out of a side window. Veterans: Fighter 1; MV 30’/90’, AC 5, HD 1, hp 6 each, spear or short sword 10+, 1d6+1, F1, ML +2, AL L, XP 10; Alertness, Intimidation; 6sp + 20cp each. Bowmen: 0-level; AC 4 (chain), HD 1-1, hp 4 each, composite bow or sword 11+, 1d6, NM, ML +1, XP 5; 4sp + 20cp each. (AX3 p. 62)"]
  - ["119-122", "2d4 footpads (109-112 statline) loot a storefront into a wagon in the alley; once they have 3d4 loads [JJ: 6d100 st] they leave for a Bridge District warehouse. Interrupted, they warn the party off “syndicate business”. West of the Mirmen Sand & Bones, east the Argollëan Family. (AX3 pp. 62-63)"]
  - ["123-126", "2d4 hoods (109-112 statline) shadow the party. If they outnumber it they rob it; otherwise they follow 1d3 turns hoping to mug a straggler or someone leaving. West Sand & Bones, east Argollëan Family. (AX3 p. 63)"]
  - ["127-130", "Screams: 1d4 drunk local hoods (109-112 statline) assault a young woman. Rescued, she is a patrician (CHA 18, Seduction) going to a secret tryst; 1d10 paramour: 1-2 Liber Faunus (Argollëan Family), 3-4 Apollonis Meteros (Merchant Guild), 5-6 Clitus Omnus (Treasurer, Tower of Knowledge), 7-8 Narmirio Drakomir (Tribune of the City Watch), 9-10 Valens Icus Ambador (Municipal Council). Escort her home: on a Friendly reaction the NPC's favour, or the party may be silenced. (AX3 p. 63)"]

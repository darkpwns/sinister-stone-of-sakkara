schema: acks-table/1
id: sotn-unsettling-events
title: "Unsettling Events - Nethercity"
source: {campaign: true, book: SOTN, printed_pages: [19, 20]}
notes: "Event throw every 12 turns (2 hours) in the Nethercity: 1d6, 6+ → roll here; the event happens at the next fitting moment; re-roll an event that already happened (SOTN pp. 19-20). Not an encounter table."
columns: ["1d20", "Event"]
rows:
  - ["1", "A songbird flies in; its song forces an extra encounter throw (it came through the L4 platform)"]
  - ["2", "Sewage drips from a ceiling crack; each drop echoes too loudly"]
  - ["3", "A tremor: jars topple, hairline cracks open in the ceiling"]
  - ["4", "The most-wounded character feels gnawing pain: pale grubs are feeding in the wound"]
  - ["5", "A pack leaks blood: a crushed rat is inside it"]
  - ["6", "Two ant swarms wage a tiny war here; the winners eat the fallen"]
  - ["7", "Something small and sweet (a baby rabbit) floats dead in the sewage"]
  - ["8", "A sudden gust puts out every open flame and torch"]
  - ["9", "A skeleton's arm and leg jut from a gallery wall; the rest is sealed in the stone"]
  - ["10", "Grinding of stone on stone nearby, as of a slab door rolling open"]
  - ["11", "Fleshy cloaca-like openings in the rock cracks, dribbling ooze"]
  - ["12", "The next living creature met is covered in weeping abscesses and rotting wounds"]
  - ["13", "Natural grain in stone, wood or metal has twisted into skulls and Chthonic symbols"]
  - ["14", "The party's footprints behind them have vanished"]
  - ["15", "Blood spattered from a slain creature forms a Chthonic symbol"]
  - ["16", "A scream for help in Ancient Dwarven, cut off after a few seconds"]
  - ["17", "The party feels a terrible eye weigh them and find them wanting"]
  - ["18", "A sickly smell of dying flowers drifts from the nearest hallway"]
  - ["19", "Every skeleton in the next set of horizontal wall graves has its ribcage smashed"]
  - ["20", "A weeks-old boar carcass, bony and rotten, buzzing with flies"]

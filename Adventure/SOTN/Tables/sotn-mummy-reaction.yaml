schema: acks-table/1
id: sotn-mummy-reaction
title: "Mummy's Reaction to Being Woken - Nethercity"
source: {campaign: true, book: SOTN, printed_pages: [17]}
notes: "A woken mummy's first reaction is always wrath against those who disturbed it; this table is for a mummy that is parleyed with, fled from or left alive. Roll or choose and read it in light of the mummy's life (SOTN p. 17). Not an encounter table."
columns: ["1d20", "Reaction"]
rows:
  - ["1-10", "Exhaustion: returns to torpor, reseals its tomb"]
  - ["11", "Madness: woken to undeath, not the promised resurrection, it loses its reason"]
  - ["12", "Restoration: works to restore the Argollëan Empire, the Nethercity or its own temple"]
  - ["13", "Vengefulness: seeks out and sacks the tomb of a rival of its era who caused its death"]
  - ["14", "Loneliness: seeks the tomb of a friend or kin of its era for company"]
  - ["15", "Curiosity: wants to learn how the world stands, by talking with adventurers or captives or by exploring"]
  - ["16", "Hedonism: takes what pleasure it still can, perhaps vicariously through captives and slaves"]
  - ["17", "Piety: goes to the nearest altar or shrine of its Chthonic god to give thanks"]
  - ["18", "Regret: now thinks the Chthonic faith lied; warns others to earn redemption"]
  - ["19", "Ambition: reborn among lesser beings, it means to reclaim greatness"]
  - ["20", "Nihilism: wants ruin and despair for every living thing"]

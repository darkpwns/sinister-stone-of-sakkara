notes: "Nethercity areas I, M. Throw 1d6 every 3 turns, 6+ (SOTN p. 18); then 2d10. Average encounter 112 XP (level 2-3) (SOTN p. 19). Party sealed in a temple or tomb: only entries marked 'enters a sealed temple or tomb' (Temple / Tomb column) reach them; ignore the rest. Optional clearing (p. 19): in volcanic cave, temple/tomb and river areas a wandering group that was slain is not met again in that area (ignore the repeat); sewer caves never clear. ACKS I names → ACKS II MM notes as linked; faewyrd read as the lesser kind (Judge's call); 'jackals of shadow' are SOTN's jackals of darkness."

- id: vanguard-l
  title: The Imperial Vanguard goes down by the 12U cesspool to L by C2b (the ant caves; AX3 reactions at the grate or below if they meet the company)
  day: 503
  steps:
  - "settle their delve by Rulings S30 (hidden rolls) against what is left in L when they go: the soldiers (L12), the queen and eggs (L13), L3's slime, L18's ant zombies, L20's apes; firedamp over the sludge (Rulings S29): their torches (Hrodvar's warning is the company's, not theirs: a Loremastery or Engineering throw for Gabriol or Valenus, 11+)"
  - "if the company is below in L that day, run the meeting instead"
  - "record in World State and judge-notes; roll their next venture"
  source: "Rulings S30; World State day 490"

- id: month-end
  title: Month's end
  month_end: true
  from: 480
  rolls:
  - {label: "Lucilla's investment 1 (Balanced, 693gp, 1%): Vagaries of Investment", dice: 1d100}
  - {label: "Lucilla's investment 3 (Balanced, 3,000gp, 1%): Vagaries of Investment", dice: 1d100}
  - label: "Arëtar asks a task of the Captain"
    dice: 1d6
    on: "1"
    outcomes: {"1": "a task", "2-6": "none"}
    then:
    - {label: "the task", dice: 1d6, outcomes: {"1-2": "below (the Nethercity)", "3-4": "the city", "5-6": "a sanctioned mission (1d4 Knights of the Winged Sun)"}}
  steps:
  - "Guildhouse storage fee: 0.25% of each member's balance that day (`play.py bank-balances --bank guildhouse-bank --day N`), posted from holder guildhouse-bank as an `inv pay` naming the member (Rulings S16; JJ pp. 218-219)"
  - "investments: look each d100 up on the RR Vagaries of Investment table (RR Passive Investment; Rulings S10); sub-rolls as the result demands (Delay months 1d6, Discovery 2d10%, Monopoly months 1d6); returns to Lucilla as `inv receive`; no XP. Investment 2 (Risky, 700gp, 3%) is under Delay over months 16-21: no roll, no return; investment 1's Protector lasts to month 16"
  - "Vestus' Tower dues 10gp (AX3 p. 148)"
  - "magic research XP (RR Experience from Magical Research): the month's research contributed above each researcher's threshold; month 19: Vestus 3,000gp (Fireball 1,500 + Dispel Magic 1,500; threshold 2,400 at 7th: 600 XP), Neris 2,000gp (threshold 5,000 at 8th: none)"
  - "the Family's take to the boss (Vettius): the AX3 p. 75 table for the Family plus Sand & Bones, less the per-level shares of members dead or gone (4th -425, 3rd -200, 0th -1; gone in month 16: Gallus Pinarius 3rd, one wharf man 0th; gone in month 19: Vibius Turpio 4th, day 558; double agents #3 and #4, 0th, day 561; Gnaeus Plautus 4th, day 565; double agent #5, 0th, day 568), plus the Pony's honest-trade owner's half 1,624gp (Rulings S19, S22, S25)"
  - "hijink XP: the take above the boss's monthly threshold (5,000 at 8th level); none on the front or the venture"
  - "Lucilla's income: the front's houses and The Mink 1,500gp; her half of the venture company 2,750gp; no XP (Rulings S19)"
  - "The Captain's report to Arëtar (Tiberius Maro from day 528; Iulia before): one day of dedicated activity this month, or his next reaction is -1 (Rulings S14). Month 16 (day 480): the mission on Varinia's circle is already fixed by the day-470 roll: skip the task roll's result"
  - "tax collectors' check on open sales (5% +1% per 1,000gp sold or banked this month, 1d100; AX3 Doing Business): only if goods were sold openly, not through the Family (Rulings S19)"
  - "Arëtar's gift after a mission he set: 750gp when done as charged, none when he wants it unspoken (Rulings S29)"
  source: "Rulings S10, S14, S16, S19, S22, S25; AX3 pp. 75, 148; RR Passive Investment"


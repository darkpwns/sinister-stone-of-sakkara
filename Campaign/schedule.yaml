# The campaign's recurring procedures (acks-schedule/1): what falls due on which day, the rolls it takes and what the
# Judge then does. Read by `acks.sh schedule due|run|done|skip` and named on every clock command (ACKS_SCHEDULE).
# Run 2 (2026-11-24): started empty. Every roll is hidden (the world's). What was done is logged in
# Campaign/schedule-log.jsonl. Run 1's schedule is in Archive/Run 1 (S01-S54)/Campaign/schedule.yaml. Judge only.
schema: acks-schedule/1
month_days: 30
items:

- id: month-end
  title: Month's end
  month_end: true
  from: 30
  steps:
  - "wages and market month (30-day months); training courses' milestones (`train due`); no domains or incomes yet"
  source: "Table rules (month length 30 days)"

  category: overland
  status: remind
  since: R2 S09
  on: [travel, forced-march]
  text: "days spent in a settlement roll no weather, so mud never dries: before the first march out of town, `weather --at HEX --day N` for each town day since the last roll"
  source: "R2 S09 (judge-notes)"


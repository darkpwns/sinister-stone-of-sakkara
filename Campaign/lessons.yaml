  source: "judge-notes S46 day 625"

- id: secret-entries-first
  category: town-routine
  run: 1                              # engine 7.24.0 (B4): never fires in run 2
  status: judge                       # scoped to run 1 (user, 2026-11-24): was refuse; it fired on every `schedule run --due`

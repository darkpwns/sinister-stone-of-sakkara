  text: "Hrodvar's tomb-jacks (Rulings S35): on a slab, lid or stone door that lifts or slides, a turn to set them gives the heaver +2 (one with Engineering) or +1 (anyone else, as Hrodvar showed them; Hrodvar left day 567 and Vettius bought the jacks): `--mod \"Hrodvar's tomb-jacks:+2\"` and `turn 1` for the setting; not on hinged doors"
  source: "Rulings S35 (Hrodvar's tomb-jacks, built day 554)"
- id: hands-before-delve
  category: delve-routine
  status: remind

  status: remind
  since: R2 S09
  on: ["encounter fight", "state init"]
  text: "the user's table rule: combat is a failure state; a fight starts only when the foe cannot fight back or is plainly outmatched by the party and its allies. Before this command: was parley, tribute, trade, an alliance with a rival tribe, or walking away tried? Count the foe's HD and one blow's damage against the party's hp; name the fallback if the edge fails"

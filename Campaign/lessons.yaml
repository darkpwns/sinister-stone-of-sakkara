  source: "judge-notes day 638 (S47): the schedule rolled the secret before the entries were written"

- id: wages-before-split
  category: bookkeeping
  status: remind
  since: S47
  on: ["party remove", "travel", "camp", "rest-day"]
  text: "before days pass away from the employers' eyes: `wages show` and pay every wage that falls due before the expected return PLUS A MONTH (the march may run long) (a missed wage is a calamity roll at the rollover); a helper script that cuts engine lines must stop on 'missed' and 'loyalty'"
  source: "judge-notes days 666-680 (S47): Ennia, Phaedra (Hostility) and Tiberius missed"

- id: lady-favour-reroll
  category: rulings
  status: judge                      # lapsed day 773 (S50): no actor carries the favour now
  since: S49
  on: [save]
  where: ["party.conditions ~ Lady's favour[^;\"\\]]{0,200}unused"]
  text: "a party member who fails this save may carry the Lady's favour (Calefa's boon, day 743, to day 773): the AI player re-rolls once if it matters (the first result stands if the second is worse); then mark it used on his conditions"
  source: "Rulings S48 (Calefa's boon), S49 (granted day 743)"

- id: move-within-speed
  category: combat
  status: remind
  since: S49
  on: ["state distance"]
  where: ["fight.open"]
  text: "a party member's move in a round is at most his running speed (combat speed if he also attacks or casts): `acks.sh move-rate ID` (loaded Lucilla, Brennus and Aelia run 30'); a charge is refused past running speed, a plain move is not"
  source: "judge-notes S49 day 743 round 13 (Lucilla and Vettius moved 90')"

- id: hench-level-loyalty-once
  category: henchmen
  status: remind
  since: S49
  on: [loyalty]
  where: ["argv ~ --trigger level"]
  text: "`level-up --member ID --apply` already rolls a henchman's level loyalty: do not roll it again"
  source: "judge-notes S49 day 743 (Ennia's second roll void)"

# ---- run 2 (from 2026-11-24)
- id: camp-past-encounter
  category: overland
  status: engine
  triggered_since: R2 S13
  since: R2 S03
  on: [camp, rest-day, water, travel, forced-march, wait, forage, hunt, search, firewood]
  where: ["encounter.open"]
  text: "an encounter is open (a night encounter the camp stopped at): resolve it (`encounter surprise|reaction|fight`, then `encounter end`) and `camp --resume`; a second `camp` ran 12 hours past the wraiths (Rulings R2 S03)"
  source: "R2 S03 day 8 (Tertia's death replayed)"
  enforced_by: "engine 7.23.0 (A1): encounter end refuses an arrived unplayed encounter without --unplayed; acks.sh batch stops after a command that brought one; camp, wait, travel, location and the day commands refuse while one is unresolved (ACKS_ACK=encounter-open)"


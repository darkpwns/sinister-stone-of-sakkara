  category: combat-procedure
  status: engine
  since: S13
  triggered_since: S29
  text: "`state end` records the defeated monsters in the adventure ledger and writes party hp to the actors: no `recover --monster` or hp copy by hand (fled or captured foes: the JUDGE line gives the command)"
